# gps-tof configuration: NOvA beam timing offsets, NuMI target / Near Detector -> Ash River.
#
# Override order: command line > environment (GPS_TOF_*) > .env > this file > built-in defaults.
# Angles accept decimal degrees, "D M S H", "D:M:S H", "D M.MMMM H" or NMEA via gps-tof-nmea.
# offset_enu_m is the vector from the surveyed point to the physics endpoint in the local
# East/North/Up frame (metres): a detector 120 m below its antenna is [0, 0, -120].

project: "NOvA NuMI -> Ash River timing offsets"
clock_hz: 64.0e+6            # NOvA timing-system clock (15.625 ns/tick)
legacy_unit_s: 500.0e-9     # legacy Global Trigger unit
earth:
  model: wgs84              # wgs84 | grs80 | sphere   (sphere is kept as the reference row of the ledger)
  sphere_radius_m: 6378137.0
offset_normal: geodetic     # geodetic | radial  ("up" used for antenna->endpoint offsets)
apply_sagnac: false         # the Sagnac term is always reported; set true to add it to the total
rounding: round             # round | floor | ceil  for the integer tick count
precision_digits: 4
physics:
  neutrino_mass_ev: 0.1
  neutrino_energy_gev: 2.0
trigger_window:             # NOvA beam trigger: [t0 + t0delay - 20 us, t0 + t0delay + 30 us)
  before_us: 20.0
  after_us: 30.0
  microslice_us: 50.0
sensitivity:
  enabled: true
  arcsec_step: 1.0
  height_step_m: 1.0
  offset_step_m: 1.0

sites:
  # ---- Fermilab ------------------------------------------------------------------------
  - name: "NuMI target (TDR 1998 design, upstream face)"
    id: target
    # NuMI Facility Technical Design Report rev 1.0 (Oct 1998), Appendix A beam sheet "horn2 ces",
    # row 0087 HALTA TAR-2: DUSAF/FSCS x, y, z in US survey feet (entrance of the device).
    # Converted with the FSCS double-stereographic projection of Beams-doc-1148.
    fscs_xyz_ft: [100327.838, 97780.188, 626.743]
    offset_enu_m: [0, 0, 0]
    source: "NuMI TDR 1998 App. A beam sheet (design); Beams-doc-1148 projection"
    notes: "Design position. As-built target (LE/ME configurations) differs at the metre level; the chord to the MINOS far detector agrees with the published 735,338 m to 6 m."
    uncertainty: {offset_m: 5.0}

  - name: "MCZERO (horn 1 upstream face, TDR 1998 design)"
    id: mczero
    # Origin of the NuMI beamline coordinate system used by the Fermilab alignment group.  MCZERO sits
    # at the upstream end of horn 1, between the target exit and the horn; the 1998 TDR design horn-1
    # entrance (beam sheet row 0089 IHHRN1) is used, 1.5 m downstream of the target entrance.
    fscs_xyz_ft: [100324.941, 97781.717, 626.552]
    source: "NuMI TDR 1998 App. A beam sheet row 0089 IHHRN1"
    notes: "Proxy for MCZERO to about 1 m along the beam (as-built horn position not public)."

  - name: "NuMI decay pipe end (TDR 1998 design)"
    id: decay-end
    fscs_xyz_ft: [98230.009, 98887.039, 488.477]
    source: "NuMI TDR 1998 App. A beam sheet row 0092 DENCU"
    notes: "Used only as the reference axis for off-axis angles (target -> decay-pipe end is the beam axis)."

  - name: "FNAL MINOS Surface Building mast antenna"
    id: fnal-mast
    lat: "41 50 23 N"           # quoted to 1 arcsecond (about 31 m N-S, 23 m E-W)
    lon: "88 16 13 W"
    height_m: 228.0
    datum: ellipsoid            # datum of the 228 m altitude is not recorded; see uncertainty.height_m
    offset_enu_m: [0, 0, 0]
    source: "2014 note Table 2 (MINOS-based TDU receivers)"
    uncertainty: {quantization_arcsec: 1.0, height_m: 33.0}

  - name: "NOvA ND upstream face centre (Fermilab alignment survey)"
    id: nd
    # DEFINITIVE surveyed position.  Fermilab Survey, Alignment and Geodesy group: "NOvA Near Detector
    # Upstream Face Center coordinates in the NuMI beamline system", origin MCZERO, X = beam right
    # (eastward looking downstream), Y = stationing, positive downstream, Z = up, orthogonal to the beam.
    # X = -11.565000 m, Y = 993.350283 m, Z = -3.643551 m.  Computed with the 3x3 module
    # width/height of 158.125 in and the beamline dimensions of drawing 489389 (tunnel cross section).
    axis_position: {frame: {origin: mczero, through: minos-fd}, along_m: 993.350283, right_m: -11.565000, up_m: -3.643551}
    # Front face: 3x3 modules = 158.125 in square (survey note); half-width 79.0625 in = 2.0081875 m.
    # Derived edge sites nd-left / nd-right (and nd-top / nd-bottom) are placed in the same frame.
    face: {half_width_m: 2.0081875, half_height_m: 2.0081875}
    offset_enu_m: [0, 0, 0]
    cable_length_m: 30.48
    cable_velocity_factor: 0.85
    source: "Fermilab SAG survey note, NuMI beamline coordinates from MCZERO; definitive"
    notes: "Definitive ND endpoint.  11.57 m left of the axis (the mast antenna fix gave 11.57 m), 3.6 m below it, 993.35 m from MCZERO (994.9 m from the target entrance)."
    uncertainty: {offset_m: 1.0}

  - name: "ND placed 1015 m along the beam (quoted placement, superseded by the survey)"
    id: nd-1015
    axis_position: {along_m: 1015.0, right_m: -11.570, up_m: 5.123}
    source: "1015 m from target (quoted placement); transverse from 2014-note mast antenna, 105 + 15 m down"
    notes: "Kept for comparison: 20 m too far along the beam and 8.8 m too high against the survey."

  - name: "ND endpoint if it were under the MINOS mast (105 + 15 m down)"
    id: nd-under-mast
    lat: "41 50 23 N"
    lon: "88 16 13 W"
    height_m: 228.0
    datum: ellipsoid
    offset_enu_m: [0, 0, -120]
    offset_note: "105 m cavern depth + 15 m mast"
    source: "2014 note sec. 3.1 and Tables 2-3 (superseded: the ND is not under the mast)"
    notes: "Kept for comparison only; it is 948 m from the target, 65 m short of the ND."
    uncertainty: {quantization_arcsec: 1.0, height_m: 33.0, offset_m: 10.0}

  # ---- Ash River ----------------------------------------------------------------------
  - name: "NOvA FD upstream face centre (Fermilab alignment survey)"
    id: fd
    # DEFINITIVE surveyed position.  Fermilab Survey, Alignment and Geodesy group (V. Bocean), note to
    # L. Corwin: "NOvA Far Detector Upstream Face Center coordinates in the beamline system",
    # origin MCZERO, X = beam right (eastward looking downstream), Y = stationing, positive downstream,
    # Z = up, orthogonal to the beam.  X = -11037.455993 m, Y = 810422.323775 m, Z = -4162.644422 m.
    # The point is 7.5" from the rail-midline/wall intersection (bookend) and at NAVD88 elevation
    # H = 1209.1058 ft = 368.535 m (floor 1181.8175 ft + 23.25" pallet + 304.21" half plane).
    # Beamline Y axis realised here as the line MCZERO -> MINOS FD midpoint (the as-built aiming line);
    # it reproduces the surveyed NAVD88 elevation to 1.5 m (h = H + N, N = -32.46 m at Ash River),
    # whereas the 1998 design axis (target -> decay-pipe end) misses it by 17 m.
    axis_position: {frame: {origin: mczero, through: minos-fd}, along_m: 810422.323775, right_m: -11037.455993, up_m: -4162.644422}
    # Front face: the survey note uses 304.21 in as the half size of the detector plane (15.45 m square).
    face: {half_width_m: 7.726934, half_height_m: 7.726934}
    offset_enu_m: [0, 0, 0]
    cable_length_m: 30.48
    cable_velocity_factor: 0.85
    source: "Fermilab SAG survey note (V. Bocean), beamline coordinates from MCZERO; definitive"
    notes: "Definitive FD endpoint.  Residual vs NAVD88 elevation: +1.5 m (geoid/datum level).  Supersedes the antenna-derived front face (fd2 - 19.8 m), which it exceeds by 58 m horizontally."
    uncertainty: {offset_m: 1.0}

  - name: "Ash River Ant-1 (FD front-face centre)"
    id: fd1
    lat: "48 22.715780 N"       # degrees + decimal minutes, 1e-6' = 2 mm
    lon: "92 49.876930 W"
    height_m: 348.0
    datum: ellipsoid            # Table 2 heights shown to be WGS84 ellipsoidal (POLYP cross-check)
    offset_enu_m: [0, 0, -19.8]
    offset_note: "12 m antenna -> detector top + 7.8 m to mid-height"
    source: "2014 note Table 2"
    uncertainty: {offset_m: 2.0}

  - name: "Ash River Ant-2 fix, front face via -19.8 m (antenna-derived, superseded)"
    id: fd2
    lat: "48 22.715780 N"
    lon: "92 49.876930 W"
    height_m: 348.638
    datum: ellipsoid
    offset_enu_m: [0, 0, -19.8]
    offset_note: "12 m antenna -> detector top + 7.8 m to mid-height"
    cable_length_m: 30.48
    cable_velocity_factor: 0.85
    source: "2014 note Table 2 (antenna used by the 2013 notebook)"
    notes: "Superseded by the surveyed front face (id fd), which is 58 m away horizontally and 8.8 m higher."
    uncertainty: {offset_m: 2.0}

  - name: "Ash River Ant-3 (FD front-face centre)"
    id: fd3
    lat: "48 22.716416 N"
    lon: "92 49.877639 W"
    height_m: 350.346
    datum: ellipsoid
    offset_enu_m: [0, 0, -19.8]
    offset_note: "12 m antenna -> detector top + 7.8 m to mid-height"
    source: "2014 note Table 2 / $GPGGA 2013-03-07 21:03:41 UTC"
    uncertainty: {offset_m: 2.0}

  - name: "MINOS Far Detector (supermodule midpoint, Soudan)"
    id: minos-fd
    lat: 47.820267
    lon: -92.241412
    height_m: -248.4
    datum: ellipsoid            # NAD83 ellipsoid height
    source: "MINOS detectors NIM A 596 (2008) 190, sec. 6.5"
    notes: "Cross-check only: paper quotes 735,338.0 m from the upstream end of horn 1."

# The beam axis is the line from the NuMI target through the MINOS far detector (the beam was
# aimed at Soudan).  Every site, baseline and opening angle is reported relative to it.
beam_axis: {from: target, to: minos-fd, label: "NuMI beam axis (target -> MINOS FD)"}

baselines:
  - {from: nd, to: fd, label: "ND upstream face -> FD upstream face (both surveyed)"}
  - {from: target, to: fd, label: "NuMI target -> FD upstream face (surveyed)"}
  - {from: target, to: nd, label: "NuMI target -> ND upstream face (surveyed)"}
  - {from: mczero, to: fd, label: "MCZERO -> FD upstream face (surveyed; stationing 810,422.324 m)"}
  - {from: mczero, to: nd, label: "MCZERO -> ND upstream face (surveyed; stationing 993.350 m)"}
  - {from: nd-1015, to: fd, label: "ND at the quoted 1015 m -> FD (superseded ND placement)"}
  - {from: nd-under-mast, to: fd2, label: "ND under the mast -> FD from the Ant-2 fix (superseded 2014-note geometry)"}
  - {from: target, to: minos-fd, label: "NuMI target -> MINOS FD (validation of the target position)"}
  - {from: target, to: decay-end, label: "NuMI target -> decay-pipe end (TDR design axis)"}

opening_angles:
  # angle at the vertex between the chords vertex -> a and vertex -> b (each also vs the beam axis)
  - {vertex: target, a: nd, b: fd, label: "Target: ND vs FD (both surveyed)"}
  - {vertex: target, a: nd, b: minos-fd, label: "Target: ND (surveyed) vs MINOS FD"}
  - {vertex: target, a: nd-1015, b: nd, label: "Target: ND at the quoted 1015 m vs surveyed ND"}
  - {vertex: target, a: nd-under-mast, b: nd, label: "Target: ND under the mast (2014 note) vs surveyed ND"}
  - {vertex: target, a: fd2, b: fd, label: "Target: FD from the Ant-2 fix vs surveyed FD"}

timing_shifts:
  - name: "Main Injector 141-turn shift (2012 shutdown)"
    turns: 141
    buckets_per_turn: 588
    rf_hz: 53.1034e+6
    rf_uncertainty_hz: 1000.0
    notes: "beam relative to MIBS $74 moved by 141 MI revolutions; flat-top RF"
