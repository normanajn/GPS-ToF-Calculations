<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Elevation view of the lake sites: both lie just under the ground surface above the extended beam axis, Two Harbors 5.4 km above the axis line at 633 km and Lake Vermilion 0.34 km above it at 740 km; the chords from the target dip 2.853 and 3.314 degrees against 3.341 degrees for the axis.">
<style>
  svg { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  text { font-size: 12px; fill: #1d2126; }
  .small { font-size: 11px; fill: #5d6670; }
  .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  .beam { stroke: #0b6e8f; }
  .beamtext { fill: #0b6e8f; font-weight: 600; }
  .fartext { fill: #8a3b2f; }
  .far { stroke: #8a3b2f; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrbeamL2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6e8f"/></marker>
  </defs>
  <path d="M 30 126 C 260 128, 540 180, 700 300 C 760 345, 800 368, 850 390 L 850 470 L 30 470 Z" fill="rgba(201,183,156,0.22)" stroke="none"/>
  <path d="M 30 126 C 260 128, 540 180, 700 300 C 760 345, 800 368, 850 390" fill="none" stroke="#c9b79c" stroke-width="2"/>
  <text class="small" x="200" y="112">ground surface (Earth curvature exaggerated); the lake points are 100 ft below the water surface</text>
  <line x1="90" y1="170" x2="420" y2="170" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="small" x="190" y="164">local horizontal at the target</text>
  <line class="beam" x1="90" y1="170" x2="845" y2="355" stroke-width="2.5" marker-end="url(#arrbeamL2)"/>
  <!-- chords: Two Harbors (560,207), Vermilion (715,310) -->
  <line x1="90" y1="170" x2="560" y2="207" stroke="#1d2126" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="90" y1="170" x2="715" y2="310" stroke="#1d2126" stroke-width="1.6"/>
  <path d="M 270 170 A 180 180 0 0 1 268.6 184.2" fill="none" stroke="#1d2126" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 220 170 A 130 130 0 0 1 216.2 201.0" fill="none" stroke="#0b6e8f" stroke-width="1.2"/>
  <path d="M 170 170 A 80 80 0 0 1 167.8 187.9" fill="none" stroke="#1d2126" stroke-width="1.2"/>
  <!-- callout -->
  <text class="small" x="40" y="272" font-weight="600">dip below the local horizontal at the target</text>
  <text class="mono" x="40" y="290">2.853°</text><text class="small" x="96" y="290">to Two Harbors (dashed arc)</text>
  <text class="mono" x="40" y="306">3.314°</text><text class="small" x="96" y="306">to Lake Vermilion (solid arc)</text>
  <text class="mono beamtext" x="40" y="322">3.341°</text><text class="small" x="96" y="322">beam axis (blue arc)</text>
  <text class="small" x="40" y="346">Two Harbors chord arrives rising 2.846°; Lake Vermilion chord arrives rising 3.343°</text>
  <text class="small" x="40" y="360">height-datum step (MSL → ellipsoid): −1.45 m (Two Harbors), −1.80 m (Vermilion) of chord</text>
  <!-- sites -->
  <circle cx="90" cy="170" r="6" fill="#0b6e8f"/>
  <text x="90" y="82" text-anchor="middle">NuMI target</text>
  <text class="small" x="90" y="96" text-anchor="middle">41 m below the surface</text>
  <circle cx="560" cy="207" r="5" fill="#ffffff" stroke="#1d2126" stroke-width="1.8"/>
  <line x1="560" y1="212" x2="560" y2="286" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="556" y="196" text-anchor="end">Lake Superior, Two Harbors</text>
  <text class="small" x="556" y="182" text-anchor="end">633 km along, 5,389 m above the extended axis</text>
  <circle cx="715" cy="310" r="5" fill="#ffffff" stroke="#1d2126" stroke-width="1.8"/>
  <text x="730" y="292">Lake Vermilion</text>
  <text class="small" x="730" y="306">740 km along, 341 m above the axis</text>
  <rect x="687" y="313" width="26" height="26" fill="#ffffff" stroke="#0b6e8f" stroke-width="2"/>
  <text x="640" y="372" text-anchor="middle">MINOS FD</text>
  <text class="small" x="640" y="386" text-anchor="middle">705 m underground, on the axis</text>
  <rect x="820" y="378" width="20" height="16" fill="#ffffff" stroke="#8a3b2f" stroke-width="1.6" opacity="0.7"/>
  <text class="small fartext" x="880" y="420" text-anchor="end" opacity="0.8">NOvA FD, Ash River (reference)</text>
  <text class="small" x="880" y="434" text-anchor="end" opacity="0.8">4,163 m below the extended axis</text>
</svg>
