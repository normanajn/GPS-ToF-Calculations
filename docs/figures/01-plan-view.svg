<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Plan view: the beam axis from the NuMI target through the MINOS far detector, with the surveyed NOvA near detector 12.19 mrad and far detector 14.55 mrad to the left of the axis; the near-to-far chord makes 14.56 mrad with the axis.">
<style>
  svg { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  text { font-size: 12px; fill: #1d2126; }
  .small { font-size: 11px; fill: #5d6670; }
  .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  .beam { stroke: #0b6e8f; }
  .beamtext { fill: #0b6e8f; font-weight: 600; }
  .fartext { fill: #8a3b2f; }
  .far { stroke: #8a3b2f; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2126"/>
    </marker>
    <marker id="arrbeam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6e8f"/>
    </marker>
  </defs>
  <!-- compass, top left -->
  <line x1="44" y1="62" x2="52" y2="28" stroke="#1d2126" stroke-width="1.2" marker-end="url(#arr)"/>
  <text class="small" x="60" y="36">N (the axis runs N 23.9° W)</text>
  <text class="small" x="34" y="82">left of the axis = up the page</text>
  <!-- angle callout, left, between compass and chords -->
  <text class="small" x="34" y="120" font-weight="600">angles at the target</text>
  <text class="mono" x="34" y="138">12.19 mrad</text><text class="small" x="112" y="138">to the ND (solid arc)</text>
  <text class="mono" x="34" y="154">14.55 mrad</text><text class="small" x="112" y="154">to the FD (dashed arc)</text>
  <text class="mono" x="34" y="170">0.02 mrad</text><text class="small" x="112" y="170">to the decay-pipe end</text>
  <text class="mono" x="34" y="186">2.47 mrad</text><text class="small" x="112" y="186">ND vs FD opening angle</text>
  <text class="small" x="112" y="200">(−1.99 mrad in plan, −1.47 mrad vertical)</text>
  <text class="small" x="112" y="214">the ND is 2.5 m off the target → FD line</text>
  <!-- beam axis -->
  <line class="beam" x1="90" y1="300" x2="840" y2="300" stroke-width="2.5" marker-end="url(#arrbeam)"/>
  <text class="beamtext" x="890" y="352" text-anchor="end">beam axis: target → MINOS FD, azimuth 336.094°</text>
  <!-- chords: T(90,300) N(300,262) F(700,120) -->
  <line x1="90" y1="300" x2="300" y2="262" stroke="#1d2126" stroke-width="1.6"/>
  <line x1="90" y1="300" x2="700" y2="120" stroke="#1d2126" stroke-width="1.4" stroke-dasharray="7 5"/>
  <line class="far" x1="300" y1="262" x2="700" y2="120" stroke-width="1.6" stroke-dasharray="3 4"/>
  <!-- angle arcs at the target -->
  <path d="M 160 300 A 70 70 0 0 0 158.9 287.5" fill="none" stroke="#1d2126" stroke-width="1.2"/>
  <path d="M 200 300 A 110 110 0 0 0 195.5 268.9" fill="none" stroke="#1d2126" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- sites -->
  <circle cx="90" cy="300" r="6" fill="#0b6e8f"/>
  <text x="90" y="358" text-anchor="middle">NuMI target</text>
  <text class="small" x="90" y="372" text-anchor="middle">TDR 1998 design position</text>
  <circle cx="170" cy="300" r="3" fill="#1d2126"/>
  <text class="small" x="162" y="322" text-anchor="end">decay-pipe end</text>
  <text class="small" x="162" y="336" text-anchor="end">724 m, on the axis</text>
  <rect x="293" y="255" width="14" height="14" fill="#ffffff" stroke="#1d2126" stroke-width="1.6"/>
  <line x1="300" y1="269" x2="300" y2="318" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="300" y="334" text-anchor="middle">NOvA ND</text>
  <text class="small" x="300" y="348" text-anchor="middle">994 m along, 11.6 m left (surveyed)</text>
  <circle cx="262" cy="262" r="3" fill="#1d2126"/>
  <line x1="262" y1="262" x2="262" y2="246" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="small" x="256" y="228" text-anchor="end">MINOS mast antenna</text>
  <text class="small" x="256" y="242" text-anchor="end">941 m along, 53 m upstream of the ND</text>
  <rect x="688" y="110" width="24" height="20" fill="#ffffff" stroke="#8a3b2f" stroke-width="2"/>
  <text class="fartext" x="722" y="118">NOvA FD, Ash River (surveyed)</text>
  <text class="small" x="722" y="132">810,423 m along, 11,037 m left</text>
  <text class="small" x="722" y="146">("12 km west of the beam")</text>
  <rect x="607" y="287" width="26" height="26" fill="#ffffff" stroke="#0b6e8f" stroke-width="2"/>
  <text x="890" y="322" text-anchor="end">MINOS FD, Soudan</text>
  <text class="small" x="890" y="336" text-anchor="end">735,345 m along, on the axis by definition</text>
  <!-- lake sites -->
  <circle cx="500" cy="300" r="4" fill="#ffffff" stroke="#1d2126" stroke-width="1.6"/>
  <text class="small" x="500" y="322" text-anchor="middle">Lake Superior, Two Harbors</text>
  <text class="small" x="500" y="336" text-anchor="middle">633,420 m along, 19 m right: in the axis plane</text>
  <circle cx="660" cy="290" r="4" fill="#ffffff" stroke="#1d2126" stroke-width="1.6"/>
  <line x1="660" y1="286" x2="660" y2="278" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="small" x="660" y="270" text-anchor="middle">Lake Vermilion</text>
  <text class="small" x="660" y="256" text-anchor="middle">739,878 m along, 2.3 km left</text>
  <!-- chord labels in clear space -->
  <text class="fartext" x="300" y="136">ND → FD chord</text>
  <text class="small" x="300" y="150">809,515 m · 2700.251 µs · 172,816.0 ticks</text>
  <text class="small" x="300" y="164">14.56 mrad to the beam axis</text>
  <text class="small" x="600" y="226" text-anchor="middle">target → FD chord 810,509 m · 2703.568 µs · 173,028.3 ticks</text>
  <text class="small" x="600" y="240" text-anchor="middle">target → ND chord 994 m · 3.317 µs · 212.3 ticks</text>
</svg>
