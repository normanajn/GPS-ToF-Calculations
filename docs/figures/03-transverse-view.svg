<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Transverse view looking downstream along the beam axis: the near detector sits 11.6 m to the left and 3.6 m below the axis, the MINOS-mast antenna 11.6 m left and 125 m above, and the Ash River far detector 11,037 m left and 4,163 m below.">
<style>
  svg { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  text { font-size: 12px; fill: #1d2126; }
  .small { font-size: 11px; fill: #5d6670; }
  .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  .beam { stroke: #0b6e8f; }
  .beamtext { fill: #0b6e8f; font-weight: 600; }
  .fartext { fill: #8a3b2f; }
  .far { stroke: #8a3b2f; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2126"/>
    </marker>
  </defs>
  <!-- crosshair at the axis (450,160) -->
  <line x1="300" y1="160" x2="560" y2="160" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arr3)"/>
  <line x1="450" y1="290" x2="450" y2="70" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arr3)"/>
  <text class="small" x="566" y="164">right (east of the line)</text>
  <text class="small" x="458" y="66">up</text>
  <circle cx="450" cy="160" r="7" fill="none" stroke="#0b6e8f" stroke-width="2.5"/>
  <circle cx="450" cy="160" r="2" fill="#0b6e8f"/>
  <text class="beamtext" x="462" y="180">beam axis (target → MINOS FD)</text>
  <!-- clock arcs from "up", counter-clockwise -->
  <path d="M 450 110 A 50 50 0 0 0 402.3 175.0" fill="none" stroke="#1d2126" stroke-width="1.2"/>
  <path d="M 450 80 A 80 80 0 0 0 375.2 188.2" fill="none" stroke="#8a3b2f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="small" x="458" y="104">clock angle −107°: ND (solid arc)</text>
  <text class="small fartext" x="458" y="86">clock angle −111°: FD (dashed arc)</text>
  <!-- ND at (360,120) -->
  <line x1="450" y1="160" x2="360" y2="188" stroke="#1d2126" stroke-width="1.4"/>
  <rect x="353" y="181" width="14" height="14" fill="#ffffff" stroke="#1d2126" stroke-width="1.6"/>
  <line x1="353" y1="183" x2="332" y2="156" stroke="#1d2126" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="330" y="118" text-anchor="end">NOvA ND (surveyed)</text>
  <text class="small mono" x="330" y="132" text-anchor="end">left 11.565 m, down 3.644 m</text>
  <text class="small" x="330" y="146" text-anchor="end">12.13 m off the axis at 994 m: 12.19 mrad</text>
  <!-- mast antenna above the ND -->
  <line x1="360" y1="181" x2="360" y2="56" stroke="#1d2126" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="360" cy="52" r="4" fill="#1d2126"/>
  <text class="small" x="348" y="48" text-anchor="end">MINOS mast antenna, 941 m along:</text>
  <text class="small" x="348" y="62" text-anchor="end">left 11.57 m, up 124.9 m (ND is 53 m downstream)</text>
  <!-- FD at (150,262) -->
  <line class="far" x1="450" y1="160" x2="150" y2="262" stroke-width="1.6" stroke-dasharray="3 4"/>
  <rect x="138" y="252" width="24" height="20" fill="#ffffff" stroke="#8a3b2f" stroke-width="2"/>
  <text class="fartext" x="138" y="294">NOvA FD, Ash River (surveyed)</text>
  <text class="small mono" x="138" y="308">left 11,037 m, down 4,163 m</text>
  <text class="small" x="138" y="322">11,796 m off the axis at 810 km: 14.55 mrad</text>
  <!-- note -->
  <text class="small" x="640" y="250" text-anchor="middle">ND and FD both lie to the left of and below the axis,</text>
  <text class="small" x="640" y="264" text-anchor="middle">only 3° apart around it: the ND is on the line of sight to the FD</text>
</svg>
