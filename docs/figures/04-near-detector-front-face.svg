<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="470" viewBox="0 0 1150 470" role="img" aria-label="The NOvA near detector front face, 4.016 m square, seen looking downstream, with the beam axis 11.565 m to the right and 3.644 m above the face centre, contours of constant angle to the beam axis across the face, the angle at the centre, edges and corners, and the point where the target to far detector line of sight crosses the face plane.">
<style>
  svg { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  text { font-size: 12px; fill: #1d2126; }
  .small { font-size: 11px; fill: #5d6670; }
  .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  .beam { stroke: #0b6e8f; }
  .beamtext { fill: #0b6e8f; font-weight: 600; }
  .fartext { fill: #8a3b2f; }
  .far { stroke: #8a3b2f; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6e8f"/>
    </marker>
    <clipPath id="faceclip"><rect x="170" y="100" width="320" height="330"/></clipPath>
  </defs>
  <!-- scale: 1 m = 60 px; face centre (330,260); beam-axis point (1023.9,41.4) -->
  <text class="small" x="30" y="40">scale 1 m = 60 px · right = beam right (east) · angles are to the beam axis (target → MINOS FD), measured at the target</text>
  <!-- iso-angle contours: circles about the axis point, radius 994.35 m × tan(angle) -->
  <g clip-path="url(#faceclip)" fill="none" stroke="#1d2126" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6">
    <circle cx="1023.9" cy="41.4" r="596.6"/>
    <circle cx="1023.9" cy="41.4" r="656.3"/>
    <circle cx="1023.9" cy="41.4" r="716.0"/>
    <circle cx="1023.9" cy="41.4" r="775.6"/>
    <circle cx="1023.9" cy="41.4" r="835.3"/>
    <circle cx="1023.9" cy="41.4" r="895.0"/>
  </g>
  <text class="small" x="496" y="312">10 mrad</text>
  <text class="small" x="496" y="426">11</text>
  <text class="small" x="422" y="444" text-anchor="middle">12</text>
  <text class="small" x="353" y="444" text-anchor="middle">13</text>
  <text class="small" x="284" y="444" text-anchor="middle">14</text>
  <text class="small" x="218" y="444" text-anchor="middle">15 mrad</text>
  <text class="small" x="170" y="462">dotted arcs: contours of constant angle to the beam axis across the face plane</text>
  <!-- the face -->
  <rect x="209.5" y="139.5" width="241" height="241" fill="none" stroke="#1d2126" stroke-width="2"/>
  <line x1="209.5" y1="260" x2="450.5" y2="260" stroke="#1d2126" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="330" y1="139.5" x2="330" y2="380.5" stroke="#1d2126" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text class="small" x="330" y="112" text-anchor="middle">4.016 m (158.125 in) square</text>
  <!-- points and their angles to the beam axis -->
  <circle cx="330" cy="260" r="4" fill="#1d2126"/>
  <text class="mono" x="338" y="278">12.194 mrad</text>
  <text class="small" x="338" y="292">centre (surveyed)</text>
  <circle cx="209.5" cy="260" r="3" fill="#1d2126"/>
  <text class="mono" x="200" y="264" text-anchor="end">14.132 mrad</text>
  <circle cx="450.5" cy="260" r="3" fill="#1d2126"/>
  <text class="mono" x="460" y="264">10.285 mrad</text>
  <circle cx="330" cy="139.5" r="3" fill="#1d2126"/>
  <text class="mono" x="330" y="130" text-anchor="middle">top 11.746 mrad</text>
  <circle cx="330" cy="380.5" r="3" fill="#1d2126"/>
  <text class="mono" x="330" y="400" text-anchor="middle">bottom 12.944 mrad</text>
  <circle cx="209.5" cy="139.5" r="2.5" fill="#1d2126"/>
  <text class="mono small" x="202" y="134" text-anchor="end">13.748</text>
  <circle cx="450.5" cy="139.5" r="2.5" fill="#1d2126"/>
  <text class="mono small" x="458" y="134">9.750</text>
  <circle cx="209.5" cy="380.5" r="2.5" fill="#1d2126"/>
  <text class="mono small" x="240" y="400" text-anchor="end">14.785</text>
  <circle cx="450.5" cy="380.5" r="2.5" fill="#1d2126"/>
  <text class="mono small" x="420" y="400">11.165</text>
  <!-- target -> FD line of sight crossing the face plane: 1.978 m left, 1.464 m below the centre -->
  <circle class="far" cx="211.3" cy="347.8" r="5" fill="none" stroke-width="1.8"/>
  <line class="far" x1="205.3" y1="347.8" x2="217.3" y2="347.8" stroke-width="1.2"/>
  <line class="far" x1="211.3" y1="341.8" x2="211.3" y2="353.8" stroke-width="1.2"/>
  <line class="far" x1="205" y1="347.8" x2="198" y2="347.8" stroke-width="1"/>
  <text class="small fartext" x="194" y="337" text-anchor="end">target → FD line of sight</text>
  <text class="small fartext" x="194" y="351" text-anchor="end">crosses the face plane here:</text>
  <text class="small fartext" x="194" y="365" text-anchor="end">1.98 m left, 1.46 m below the centre</text>
  <!-- direction to the beam axis -->
  <line x1="450.5" y1="260" x2="1000" y2="50" stroke="#0b6e8f" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arr4)"/>
  <text class="small" x="560" y="250">centre → axis: 11.565 m right, 3.644 m up = 12.125 m transverse,</text>
  <text class="small" x="560" y="264">12.194 mrad seen from the target, 994.35 m upstream</text>
  <circle cx="1023.9" cy="41.4" r="7" fill="none" stroke="#0b6e8f" stroke-width="2.5"/>
  <circle cx="1023.9" cy="41.4" r="2" fill="#0b6e8f"/>
  <text class="beamtext" x="1010" y="18" text-anchor="end">beam axis (target → MINOS FD)</text>
  <text class="small" x="1010" y="32" text-anchor="end">crosses the face plane here, off the detector</text>
  <!-- scale bar -->
  <line x1="960" y1="420" x2="1020" y2="420" stroke="#1d2126" stroke-width="2"/>
  <line x1="960" y1="415" x2="960" y2="425" stroke="#1d2126" stroke-width="1.5"/>
  <line x1="1020" y1="415" x2="1020" y2="425" stroke="#1d2126" stroke-width="1.5"/>
  <text class="small" x="1028" y="424">1 m</text>
</svg>
